name: Followup KPI demo tests
on:
  pull_request:
    paths:
      - 'tools/followup-kpi/**'
      - '.github/workflows/followup-kpi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        working-directory: tools/followup-kpi
        run: python -m unittest discover -s tests -v
