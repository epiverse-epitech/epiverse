# EpiVerse — intégration continue : chaque pull request et chaque push sur main et develop.
# Chaque job ne tourne que si l'application existe déjà dans le dépôt : le kit peut arriver avant le code.
# Contrôles alignés sur DOC-013 (checklist PR-09) et DOC-014 (pipeline cible).
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # À ajuster si le squelette utilise d'autres dossiers (mêmes valeurs que .env et deploy.yml)
  API_DIR: apps/api
  APP_DIR: apps/app
  NODE_VERSION: "24"

jobs:
  detect:
    name: Détection des applications
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          api=false
          app=false
          if [ -f "$API_DIR/package.json" ]; then api=true; fi
          if [ -f "$APP_DIR/package.json" ]; then app=true; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          {
            echo "### Applications détectées"
            echo "- API ($API_DIR) : $api"
            echo "- App Expo ($APP_DIR) : $app"
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installer gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scanner tout l'historique Git
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  api:
    name: API — lint, tests, build
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.API_DIR }}
    services:
      postgres:
        image: pgvector/pgvector:pg17-bookworm
        env:
          POSTGRES_USER: epiverse
          POSTGRES_PASSWORD: epiverse_ci
          POSTGRES_DB: epiverse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U epiverse -d epiverse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://epiverse:epiverse_ci@localhost:5432/epiverse_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.API_DIR }}/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Prisma — client et migrations sur la base de test
        if: hashFiles(format('{0}/prisma/**', env.API_DIR)) != ''
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Lint
        run: npm run --if-present lint
      - name: Tests unitaires
        run: npm run --if-present test
      - name: Tests d'intégration (e2e)
        run: npm run --if-present test:e2e
      - name: Build
        run: npm run build
      - name: Audit des dépendances de production (faille critique = bloquant)
        run: npm audit --omit=dev --audit-level=critical

  app:
    name: App Expo — lint, types, tests, export web
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: /api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        # Le template Expo n'a pas de config ESLint : « expo lint » la créerait en pleine CI.
        run: |
          if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then
            npm run --if-present lint
          else
            echo "::warning::Pas de config ESLint dans $APP_DIR : lancer « npx expo lint » une fois en local, puis commiter eslint.config.js"
          fi
      - name: Vérification des types
        if: hashFiles(format('{0}/tsconfig.json', env.APP_DIR)) != ''
        # expo-env.d.ts est ignoré par Git mais nécessaire à TypeScript (types CSS, images…).
        run: |
          [ -f expo-env.d.ts ] || printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
          npx tsc --noEmit
      - name: Tests
        run: npm run --if-present test
      - name: Export web (même commande que l'image Docker)
        env:
          EXPO_OFFLINE: "1"
        run: npx expo export --platform web --output-dir dist
      - name: Audit des dépendances de production (faille critique = bloquant)
        run: npm audit --omit=dev --audit-level=critical

  images:
    name: Images Docker (build de contrôle)
    needs: [detect, api, app]
    if: >-
      always() && github.event_name == 'pull_request'
      && needs.detect.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.detect.outputs.api == 'true' || needs.detect.outputs.app == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image API
        if: needs.detect.outputs.api == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          build-args: API_DIR=${{ env.API_DIR }}
          push: false
          cache-from: type=gha,scope=epiverse-api
          cache-to: type=gha,mode=max,scope=epiverse-api
      - name: Image web
        if: needs.detect.outputs.app == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          build-args: APP_DIR=${{ env.APP_DIR }}
          push: false
          cache-from: type=gha,scope=epiverse-web
          cache-to: type=gha,mode=max,scope=epiverse-web
