# EpiVerse — intégration continue : chaque pull request et chaque push sur main et develop.
# Chaque job ne tourne que si l'application existe déjà dans le dépôt : le kit peut arriver avant le code.
# Contrôles alignés sur DOC-013 (checklist PR-09) et DOC-014 (pipeline cible).
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Annuler une PR obsolète, mais jamais une CI de develop qui publie ou déploie.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # À ajuster si le squelette utilise d'autres dossiers (mêmes valeurs que .env et deploy.yml)
  API_DIR: apps/api
  APP_DIR: apps/app
  NODE_VERSION: "24"

jobs:
  detect:
    name: Détection des applications
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          api=false
          app=false
          if [ -f "$API_DIR/package.json" ]; then api=true; fi
          if [ -f "$APP_DIR/package.json" ]; then app=true; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          {
            echo "### Applications détectées"
            echo "- API ($API_DIR) : $api"
            echo "- App Expo ($APP_DIR) : $app"
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installer gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scanner tout l'historique Git
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  api:
    name: API — lint, tests, build
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.API_DIR }}
    services:
      postgres:
        image: pgvector/pgvector:pg17-bookworm
        env:
          POSTGRES_USER: epiverse
          POSTGRES_PASSWORD: epiverse_ci
          POSTGRES_DB: epiverse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U epiverse -d epiverse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://epiverse:epiverse_ci@localhost:5432/epiverse_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.API_DIR }}/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Prisma — client et migrations sur la base de test
        if: hashFiles(format('{0}/prisma/**', env.API_DIR)) != ''
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Tests unitaires
        run: npm run test
      - name: Tests d'intégration (e2e)
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Audit des dépendances de production (faille élevée ou critique = bloquant)
        run: npm audit --omit=dev --audit-level=high

  app:
    name: App Expo — lint, types, tests, export web
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: /api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        # Le template Expo n'a pas de config ESLint : « expo lint » la créerait en pleine CI.
        run: |
          if ! ls eslint.config.* .eslintrc* >/dev/null 2>&1; then
            echo "::error::Configuration ESLint manquante dans $APP_DIR"
            exit 1
          fi
          npm run lint
      - name: Vérification des types
        # expo-env.d.ts est ignoré par Git mais nécessaire à TypeScript (types CSS, images…).
        run: |
          [ -f expo-env.d.ts ] || printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
          test -f tsconfig.json || { echo '::error::tsconfig.json manquant'; exit 1; }
          npx tsc --noEmit
      - name: Tests
        run: npm run test
      - name: Export web (même commande que l'image Docker)
        env:
          EXPO_OFFLINE: "1"
        run: npx expo export --platform web --output-dir dist
      - name: Audit des dépendances de production (faille élevée ou critique = bloquant)
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Images Docker (build et scan de sécurité)
    needs: [detect, api, app]
    if: >-
      always()
      && needs.detect.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.detect.outputs.api == 'true' || needs.detect.outputs.app == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image API
        if: needs.detect.outputs.api == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          build-args: API_DIR=${{ env.API_DIR }}
          push: false
          load: true
          tags: epiverse-api:ci
          cache-from: type=gha,scope=epiverse-api
          cache-to: type=gha,mode=max,scope=epiverse-api
      - name: Image web
        if: needs.detect.outputs.app == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          build-args: APP_DIR=${{ env.APP_DIR }}
          push: false
          load: true
          tags: epiverse-web:ci
          cache-from: type=gha,scope=epiverse-web
          cache-to: type=gha,mode=max,scope=epiverse-web
      # Run the official Trivy container directly: no GitHub-release binary install.
      # TODO: replace the tested version tag with a verified image digest for releases.
      - name: "Trivy — image API : bloquer les vulnérabilités graves"
        if: needs.detect.outputs.api == 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0 image --scanners vuln --vuln-type os,library \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress epiverse-api:ci
      - name: "Trivy — image web : bloquer les vulnérabilités graves"
        if: needs.detect.outputs.app == 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0 image --scanners vuln --vuln-type os,library \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress epiverse-web:ci
  infrastructure:
    name: Infrastructure — syntaxe et configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier les scripts Bash
        run: bash -n infra/scripts/*.sh
      - name: Vérifier les scripts POSIX shell
        run: sh -n infra/docker/*.sh
      - name: Compiler le générateur de fixtures
        run: python3 -m py_compile data/fixtures/generate.py
      - name: Exécuter les tests de sécurité des fixtures si présents
        run: |
          if [ -f data/fixtures/test_safety.py ]; then
            python3 -m unittest discover -s data/fixtures -p 'test_*.py'
          fi
      - name: Valider Docker Compose local (tous profils)
        run: docker compose --profile tools --profile full -f docker-compose.yml config --quiet

  security-static:
    name: Sécurité — analyse IaC et workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trivy — configurations infrastructure
        run: |
          docker run --rm -v "$PWD:/workspace:ro" \
            aquasec/trivy:0.70.0 fs --scanners misconfig \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress /workspace

  quality-gate:
    name: Qualité — contrôle final obligatoire
    # GitHub considère les jobs skipped comme réussis : les cas attendus
    # doivent donc être explicitement vérifiés.
    if: always()
    needs: [detect, secrets, api, app, images, infrastructure, security-static]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuser tout contrôle manquant ou ignoré sans justification
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          DETECT_RESULT: ${{ needs.detect.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          INFRA_RESULT: ${{ needs.infrastructure.result }}
          SECURITY_RESULT: ${{ needs.security-static.result }}
          API_PRESENT: ${{ needs.detect.outputs.api }}
          APP_PRESENT: ${{ needs.detect.outputs.app }}
          API_RESULT: ${{ needs.api.result }}
          APP_RESULT: ${{ needs.app.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          set -euo pipefail
          expect() {
            if [ "$1" != "$2" ]; then
              echo "::error::$3: attendu '$2', obtenu '$1'"
              return 1
            fi
          }
          expect "$DETECT_RESULT" success "Détection des applications"
          expect "$SECRETS_RESULT" success "Gitleaks"
          expect "$INFRA_RESULT" success "Infrastructure"
          expect "$SECURITY_RESULT" success "Analyse IaC"
          if [ "$GIT_REF" = 'refs/heads/develop' ] || [ "$BASE_REF" = 'develop' ]; then
            expect "$API_PRESENT" true "API requise sur develop"
          fi
          if [ "$API_PRESENT" = true ]; then
            expect "$API_RESULT" success "Tests API"
          else
            expect "$API_RESULT" skipped "API absente"
          fi
          if [ "$APP_PRESENT" = true ]; then
            expect "$APP_RESULT" success "Tests Expo"
          else
            expect "$APP_RESULT" skipped "Expo absent"
          fi
          if [ "$API_PRESENT" = true ] || [ "$APP_PRESENT" = true ]; then
            expect "$IMAGES_RESULT" success "Build et scan Docker"
          else
            expect "$IMAGES_RESULT" skipped "Images Docker non applicables"
          fi
          echo "Contrôles requis validés ; seuls les skips prévus sont acceptés." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publication après validation CI
    needs: [detect, secrets, api, app, infrastructure, quality-gate]
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/develop'
      && needs.detect.result == 'success'
      && needs.secrets.result == 'success'
      && needs.infrastructure.result == 'success'
      && needs.quality-gate.result == 'success'
      && needs.api.result == 'success'
      && (needs.app.result == 'success'
          || (needs.app.result == 'skipped' && needs.detect.outputs.app == 'false'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
