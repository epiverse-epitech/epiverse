name: EpiVerse — Initialiser les types des 3 epics
# Reprise après correction du script Python
on:
  push:
    branches:
      - docs/pilotage-fu2-reconstruction-2026-11-13
    paths:
      - '.github/workflows/init-epic-types.yml'

permissions:
  contents: read
  issues: write

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tester le script Python
        run: python3 -m py_compile scripts/normalize_issues.py
      - name: Renseigner le type natif des 3 epics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBERS: '189,190,191'
          DRY_RUN: 'false'
        run: python3 scripts/normalize_issues.py
