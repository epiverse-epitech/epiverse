name: EpiVerse — Relier exigences et tâches aux epics
on:
  push:
    branches: [docs/pilotage-fu2-reconstruction-2026-11-13]
    paths: ['.github/workflows/link-issue-hierarchy.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le script
        run: python3 -m py_compile scripts/link_issue_hierarchy.py
      - name: Lier les sous-issues avec l'API GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_LINKS: '3'
          DRY_RUN: 'false'
        run: python3 scripts/link_issue_hierarchy.py
