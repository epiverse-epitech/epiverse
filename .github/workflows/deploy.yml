# EpiVerse — construction des images et déploiement.
#   push sur develop   → images publiées sur GHCR, puis déploiement automatique en staging
#   tag vX.Y.Z         → désactivé jusqu'au gate G6 (aucune release automatique)
#   lancement manuel   → staging uniquement depuis develop
# Tant qu'un serveur n'est pas configuré (variables STAGING_HOST / PRODUCTION_HOST vides),
# les images sont publiées et le déploiement est simplement sauté.
# Verrou du gate pilote G6 : PRODUCTION_HOST reste vide tant qu'Estelle n'a pas validé le pilote
# (les environnements GitHub protégés ne sont pas disponibles sur un dépôt privé en offre gratuite).
name: Déploiement

on:
  push:
    branches: [develop]
    # Pas de publication automatique sur tag tant que le gate G6 est fermé.
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [staging]
        default: staging

permissions:
  contents: read

env:
  # Mêmes valeurs que dans ci.yml et .env
  API_DIR: apps/api
  APP_DIR: apps/app

jobs:
  prepare:
    # Main ne peut pas publier, même via lancement manuel.
    if: github.ref == 'refs/heads/develop'
    name: Préparation
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.vars.outputs.environment }}
      tag: ${{ steps.vars.outputs.tag }}
      registry: ${{ steps.vars.outputs.registry }}
      images: ${{ steps.vars.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            environment="$INPUT_ENVIRONMENT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            environment=production
          else
            environment=staging
          fi
          images='[]'
          if [ -f "$API_DIR/package.json" ]; then
            images=$(jq -c --arg a "API_DIR=$API_DIR" '. + [{name: "epiverse-api", dockerfile: "infra/docker/api.Dockerfile", buildargs: $a}]' <<< "$images")
          fi
          if [ -f "$APP_DIR/package.json" ]; then
            images=$(jq -c --arg a "APP_DIR=$APP_DIR" '. + [{name: "epiverse-web", dockerfile: "infra/docker/web.Dockerfile", buildargs: $a}]' <<< "$images")
          fi
          {
            echo "environment=$environment"
            echo "tag=sha-${GITHUB_SHA::7}"
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Image ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.buildargs }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/${{ matrix.name }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/${{ matrix.name }}:${{ needs.prepare.outputs.environment }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Déploiement ${{ needs.prepare.outputs.environment }}
    needs: [prepare, build]
    if: >-
      (needs.prepare.outputs.environment == 'staging' && vars.STAGING_HOST != '')
      || (needs.prepare.outputs.environment == 'production' && vars.PRODUCTION_HOST != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-${{ needs.prepare.outputs.environment }}
      cancel-in-progress: false
    env:
      ENV_NAME: ${{ needs.prepare.outputs.environment }}
      TAG: ${{ needs.prepare.outputs.tag }}
      DEPLOY_HOST: ${{ needs.prepare.outputs.environment == 'production' && vars.PRODUCTION_HOST || vars.STAGING_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
    steps:
      - uses: actions/checkout@v7
      - name: Préparer la connexion SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host epiverse\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: Envoyer la configuration serveur versionnée
        run: |
          scp infra/server/docker-compose.server.yml "epiverse:/opt/epiverse/$ENV_NAME/"
          scp infra/scripts/deploy.sh infra/scripts/backup-db.sh infra/scripts/restore-db.sh "epiverse:/opt/epiverse/scripts/"
          ssh epiverse "chmod 750 /opt/epiverse/scripts/*.sh"
      - name: Autoriser le serveur à lire les images (jeton valable le temps du job)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029 # développement volontaire côté CI
          printf '%s' "$GHCR_TOKEN" | ssh epiverse "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: Déployer
        run: |
          # shellcheck disable=SC2029 # développement volontaire côté CI
          ssh epiverse "DEPLOY_SOURCE='$GITHUB_SHA' bash /opt/epiverse/scripts/deploy.sh '$ENV_NAME' '$TAG'"
      - name: Fermer la session du registre
        if: always()
        run: ssh epiverse "docker logout ghcr.io" || true
      - name: Résumé
        run: |
          {
            echo "### Déploiement $ENV_NAME"
            echo "- Version : $TAG (commit $GITHUB_SHA)"
            echo "- Serveur : $DEPLOY_HOST"
          } >> "$GITHUB_STEP_SUMMARY"
