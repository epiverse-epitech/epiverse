# EpiVerse: workflow réutilisable appelé UNIQUEMENT après validation complète de CI.
# Publication de staging via develop. Production volontairement désactivée jusqu'au gate G6.
name: Déploiement

on:
  workflow_call:
    inputs:
      environment:
        description: Environnement de publication (staging uniquement)
        required: true
        type: string

permissions:
  contents: read

env:
  # Mêmes valeurs que dans ci.yml et .env
  API_DIR: apps/api
  APP_DIR: apps/app

jobs:
  prepare:
    name: Préparation
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.vars.outputs.environment }}
      tag: ${{ steps.vars.outputs.tag }}
      registry: ${{ steps.vars.outputs.registry }}
      images: ${{ steps.vars.outputs.images }}
      web_ready: ${{ steps.vars.outputs.web_ready }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$INPUT_ENVIRONMENT" != "staging" ]; then
            echo "::error::Production désactivée: validation explicite du gate G6 requise."
            exit 1
          fi
          environment=staging
          images='[]'
          web_ready=false
          if [ -f "$API_DIR/package.json" ]; then
            images=$(jq -c --arg a "API_DIR=$API_DIR" '. + [{name: "epiverse-api", dockerfile: "infra/docker/api.Dockerfile", buildargs: $a}]' <<< "$images")
          fi
          if [ -f "$APP_DIR/package.json" ]; then
            web_ready=true
            images=$(jq -c --arg a "APP_DIR=$APP_DIR" '. + [{name: "epiverse-web", dockerfile: "infra/docker/web.Dockerfile", buildargs: $a}]' <<< "$images")
          fi
          {
            echo "environment=$environment"
            echo "tag=sha-${GITHUB_SHA}"
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "images=$images"
            echo "web_ready=$web_ready"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Image ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.buildargs }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/${{ matrix.name }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/${{ matrix.name }}:${{ needs.prepare.outputs.environment }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Déploiement ${{ needs.prepare.outputs.environment }}
    needs: [prepare, build]
    # Ne jamais lancer la pile serveur avec une image web inexistante.
    if: needs.prepare.outputs.web_ready == 'true' && vars.STAGING_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-${{ needs.prepare.outputs.environment }}
      cancel-in-progress: false
    env:
      ENV_NAME: ${{ needs.prepare.outputs.environment }}
      TAG: ${{ needs.prepare.outputs.tag }}
      DEPLOY_HOST: ${{ vars.STAGING_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
    steps:
      - uses: actions/checkout@v7
      - name: Préparer la connexion SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host epiverse\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: Envoyer la configuration serveur versionnée
        run: |
          scp infra/server/docker-compose.server.yml "epiverse:/opt/epiverse/$ENV_NAME/"
          scp infra/scripts/deploy.sh infra/scripts/backup-db.sh infra/scripts/restore-db.sh "epiverse:/opt/epiverse/scripts/"
          ssh epiverse "chmod 750 /opt/epiverse/scripts/*.sh"
      - name: Autoriser le serveur à lire les images (jeton valable le temps du job)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029 # développement volontaire côté CI
          printf '%s' "$GHCR_TOKEN" | ssh epiverse "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: Déployer
        run: |
          # shellcheck disable=SC2029 # développement volontaire côté CI
          ssh epiverse "DEPLOY_SOURCE='$GITHUB_SHA' bash /opt/epiverse/scripts/deploy.sh '$ENV_NAME' '$TAG'"
      - name: Fermer la session du registre
        if: always()
        run: ssh epiverse "docker logout ghcr.io" || true
      - name: Résumé
        run: |
          {
            echo "### Déploiement $ENV_NAME"
            echo "- Version : $TAG (commit $GITHUB_SHA)"
            echo "- Serveur : $DEPLOY_HOST"
          } >> "$GITHUB_STEP_SUMMARY"
