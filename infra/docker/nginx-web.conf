# nginx : sert l'export web de l'app Expo (fichiers statiques).
# Aucun add_header dans les blocs location : nginx n'hériterait plus des en-têtes de sécurité du serveur.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers générés par Expo avec une empreinte dans le nom : cache long.
    location ^~ /_expo/ {
        expires 1y;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # Pages : jamais en cache, pour que chaque déploiement soit visible immédiatement.
    # $uri.html couvre le rendu statique d'expo-router, /index.html le mode application monopage.
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
